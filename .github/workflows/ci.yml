name: Django CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-python: '3.10' # або версія, яку ти використовуєш

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      run: |
        # Створюємо тимчасовий .env для тестів у CI
        echo "DEBUG=False" > .env
        echo "SECRET_KEY=ci-test-key-safe-to-disclose-in-github-actions" >> .env
        python manage.py test